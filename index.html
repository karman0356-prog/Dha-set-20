<script>const questions=[{"source": 3786, "stem": "Ina census, if there were roughly 21 males who died as a result of a car crash for every 13 females who dicd Which of the following is the appropriate term to express this relation?", "options": {"A": "Ratio", "B": "Odds", "C": "Proportion", "D": "Rate"}, "answer": "A"}, {"source": 3789, "stem": "Definition: A study that compares the prevalence of suspected causal factors between those with and without disease. Which of the following study types is described by the definition?", "options": {"A": "Case-control Study", "B": "Experimental Study", "C": "Ecological Study", "D": "Cohort Study"}, "answer": "A"}, {"source": 3792, "stem": "Which of the following is the major entity for medical care coverage for Saudi citizens?", "options": {"A": "All private insurance i", "B": "Ministry of Health", "C": "Saudi Food and Drug Authority", "D": "BUPA Insurance a oes Which of the following terms is used to describe the factors that contribute to a person’s current state of"}, "answer": "B"}, {"source": 3795, "stem": "A measure of individual’s quality of life that consists of asking someone to value different lengths of life and quality of life. The subjects are asked which proportion of their remaining life they would be willing to sacrifice in return for being instead of a given disease. Which of the following measures is referred to by the scenario?", "options": {"A": "Rating scale", "B": "Time-trade off", "C": "Health utility index", "D": "Standard gambling"}, "answer": "B"}, {"source": 3796, "stem": "Which of the following is a requirement when using cost-minimization analysis?", "options": {"A": "Data must be obtained from earlier sources", "B": "Outcomes must be adjusted for quality of life", "C": "Consequences for each alternative must be equivalent _", "D": "Costs must include measures of lost productivity | | |"}, "answer": "C"}, {"source": 3799, "stem": "Which of the following is the definition of management?", "options": {"A": "The art of maximizing profitability", "B": "The art of maximizing productivity", "C": "The art of maximizing possibilities", "D": "The art of maximizing predictability"}, "answer": "B"}, {"source": 3801, "stem": "Which of the following quantitative research has no assigned intervention, but it involves a comparison?", "options": {"A": "Analytic pooh", "B": "Descriptive", "C": "Clinical Trial sa", "D": "Experimental"}, "answer": "A"}, {"source": 3803, "stem": "Which of the following is the interpretation of a p-value of 0.05?", "options": {"A": "There is 0.05% probability that the results are due to random chance", "B": "There is 5% probability that the results are due to random chance", "C": "There is S0% probability that the results are due to random chance", "D": "There is 95% probability that the results are due to random chance I I EN"}, "answer": "B"}, {"source": 3804, "stem": "The error that results from unpredictable fluctuation in the measurement. Which of the following errors is described?", "options": {"A": "Bias", "B": "Random", "C": "Systemic", "D": "Systematic"}, "answer": "B"}, {"source": 3805, "stem": "Researchers compare a group of people who have diabetes with a group of people who have no diabetes, and looks back in time to see how the characteristics of the two groups differ. Which of the following is the described study design?", "options": {"A": "Prospective cohort", "B": "Case-Control", "C": "Experimental", "D": "Randomized clinical"}, "answer": "B"}, {"source": 3806, "stem": "A pricing strategy that considers the benefits the product provides to the consumer rather than its cost. Which type of pricing strategy is described?", "options": {"A": "Competition", "B": "Value based", "C": "Cost plus", "D": "Bundle"}, "answer": "B"}, {"source": 3807, "stem": "Which of the following marketing mix contains market coverage and movement?", "options": {"A": "Price", "B": "Place", "C": "Product", "D": "Promotion Q, 3808 Price of a product was increased from 100 SA Riyals to 105 SA Riyals. This resulted in a large decline on demand from 120 to 80. Which of the following types of demand does this product follow?"}, "answer": "B"}, {"source": 3810, "stem": "A researcher was interested in examining the association between postmenopausal hormone replacement therapy (HRT) and the development of heart cisease. All women who were characterized as postmenopausal were approached regarding their interest in participating in the study by answering a questionnaire annually regarding their medication use and medical conditions. Of the 16,148 women who provided consent, the average length of follow-up was 12.5 years (range, 0 to 16 years). Which of the following best describes the study design?", "options": {"A": "Meta-analysis", "B": "Case-control study", "C": "Prospective cohort study", "D": "Randomized controlled trial"}, "answer": "C"}, {"source": 3811, "stem": "An investigator wishes to study a drug for the treatment of atherosclerosis in patients with diabetes. Which of the following is the best type of design for determining causality in this particular study?", "options": {"A": "A meta-analysis", "B": "A case-control study", "C": "A prospective cohort study", "D": "A randomized, standard-of-care clinical trial EEE OO EES IOSD O OIE SIEGE ETE IOI IIE ToT TOU IST TOIT UTA"}, "answer": "D"}, {"source": 3813, "stem": "A pharmacist needs to perform pharmacoeconomic analysis. Which process of the following should be done regarding the perspective (point of view) of a pharmacoeconomic analysis?", "options": {"A": "Costs should be identified, next it should be conducted from a single perspective", "B": "Costs should be identified, next it should be conducted from multiple perspectives", "C": "Costs and consequences should be identified and measured relative to the perspective (s) selected", "D": "Societal perspective should be identified, next validate perspective for a local pharmacoeconomic analysis"}, "answer": "C"}, {"source": 3814, "stem": "An evidence-based center of the hospital tends to calculate different costs while performing pharmacoeconomic analysis. Which of the following cost best represents a direct medical cost and an indirect nonmedical cost, respectively? ‘ea H", "options": {"A": "Drugs cost and suffering", "B": "Mortality and morbidity rates", "C": "Pain suffering and transportation", "D": "Medical professional time and loss of productivity"}, "answer": "D"}, {"source": 3815, "stem": "A pharmacist quantifying the value of a clinical pharmacy service, his goal is to express the benefits associated with this service in a Riyals value. Which economic evaluation method would he employ?", "options": {"A": "A cost-utility Analysis", "B": "A cost-benefit analysis", "C": "A cost-effectiveness analysis", "D": "A cost-minimization analysis"}, "answer": "B"}, {"source": 3817, "stem": "A hospital needs to decide if a new intravenous antibiotic should be added to its formulary, which is therapeutically equivalent to the antibiotic used in the hospital and has the same adverse event profile. Which of the following best represents the costs need to be identified and the analysis should be used, respectively?", "options": {"A": "Intangible cost and cost benefit analysis", "B": "Direct medical cost and cost utility analysis f", "C": "Direct medical cost and cost minimization analysis j", "D": "Indirect non medical cost and cost effectiveness analysis"}, "answer": "C"}, {"source": 3818, "stem": "Which of the following question's types is used to identify a certain piece of information?", "options": {"A": "Leading questions", "B": "Open-ended questions", "C": "Close ended questions ; | i", "D": "Process and outcome questions My { | Hil t\""}, "answer": "C"}, {"source": 3819, "stem": "Which of the following questioning techniques uses hints and clues to aid patients in answering questions?", "options": {"A": "Changing questions", "B": "Empathic responding", "C": "Prompting while asking", "D": "Redirection the questions"}, "answer": "C"}, {"source": 3820, "stem": "Which of the following is associated with less selection bias when conducting the surveillance testing strategy?", "options": {"A": "Voluntary participation", "B": "Mandatory participation", "C": "Anonymous participation", "D": "Decentralized participation"}, "answer": "B"}, {"source": 3821, "stem": "Investigator decides to examine a group of patients in respect to drug therapy outcomes to ascertain whether drug therapy is likely to cause a specified adverse reaction. Which of the following study design best to be used?", "options": {"A": "Cohort study", "B": "Case report study", "C": "Case control study", "D": "Cross sectional study"}, "answer": "A"}, {"source": 3823, "stem": "Which of the following study design is the best to use to assess the awareness on the usage of vitamin D supplements among people of Jeddah?", "options": {"A": "Cohort study |", "B": "Case report study } it Al", "C": "Case control study } | | | |", "D": "Cross sectional study a Et"}, "answer": "D"}, {"source": 3824, "stem": "Which of the following statements best describe the adverse drug event?", "options": {"A": "Treatment errors related to drug interactions", "B": "Noxious and intended drug reaction during therapy", "C": "Unintended responses to a medicine with a causal relationship between a medicine and treatment", "D": "Unexpected medical occurrence after administered a medicine with no causal relationship with treatment"}, "answer": "D"}, {"source": 3826, "stem": "Which of the following factors is the most responsible for lower medication adherence rates in blood glucose lowering therapy?", "options": {"A": "Medication cost", "B": "Drug interaction", "C": "Acute formulation", "D": "Alkaline formulation"}, "answer": "A"}, {"source": 3827, "stem": "Which of the following is the best description of the Planning process in the pharmacy department?", "options": {"A": "Process of communication, supervision, and direction by the manager", "B": "Ensuring functions of the organization are in place and are operating successfully", "C": "Tasks and responsibilities with the specific skill sets needed to complete the tasks", "D": "Coordinating of management and leadership to the knowledge of resources and the future objectives"}, "answer": "D"}, {"source": 3828, "stem": "When production budget being prepared Which of the following represent the equation to calculate the quantity that needs to be produced?", "options": {"A": "+ opening stock — quantity sold", "B": "Opening stock + quantity sold + closing stock", "C": "Quantity sold + closing stock — opening stock", "D": "+ opening stock — quantity sold — closing stock"}, "answer": "C"}, {"source": 3829, "stem": "Which one of the following cases is considered an adulteration crime for the drug product?", "options": {"A": "Labeling does include adequate directions for use", "B": "Offering the container for sale under the name of its company", "C": "Containing impurities, unmentioned, filthy, putrid, or decomposed substances", "D": "Labeling does contain the name of the manufacturer and the accurate quantity of contents"}, "answer": "C"}, {"source": 3831, "stem": "Which of the following assessment steps is considered the most important one in submitting an application for a new drug product for the Saudi Food and Drug Authority (SFDA)?", "options": {"A": "Prior approval from Ministry of Health", "B": "The safety, efficacy and quality of the product", "C": "The sale price and marketing of the product", "D": "Prior approval by US FDA or European Medicines Agency (EMA)"}, "answer": "B"}, {"source": 3833, "stem": "Which of the following represents system that prioritizes treatment based on needed personnel and those who are most critically ill or injured?", "options": {"A": "Triage", "B": "Disaster", "C": "Pandemic", "D": "Quarantine"}, "answer": "A"}, {"source": 3834, "stem": "Which of the following ethical principles ensure that any risks involved in medical treatment or procedures are outweighed by the benefit to the patient?", "options": {"A": "Social justice", "B": "Autonomy and privacy", "C": "Ethics and beneficence", "D": "Beneficence and non-malfeasance"}, "answer": "D"}, {"source": 3836, "stem": "Which of the following describe the term “reliable” in research design?", "options": {"A": "The findings can be generalized to other social settings", "B": "It was conducted by a reputable researcher who can be trusted", "C": "The measures developed for concepts are stable on different occasion or (consistent across indicators)", "D": "The methods are stated clearly enough for the research to be replicated"}, "answer": "C"}, {"source": 3837, "stem": "Which of the following statements describes the design for the cross-sectional study?", "options": {"A": "The study of a society in the period before the event", "B": "The study of more than one case in particular society at one moment in time", "C": "The comparison of two variables over a long period of time", "D": "The study of one group of patients over time"}, "answer": "B"}, {"source": 3838, "stem": "Compiling and continually updating an accurate list of all medications a patient is using and then using this list to ensure that patients are given the correct medications is an essential process of patient care. Which of the following describes this process?", "options": {"A": "E-prescribing", "B": "Medication reconciliation", "C": "Computerized administration record", "D": "Computerized physician order entry"}, "answer": "B"}, {"source": 3839, "stem": "Which of the following is the log that contains the prescription order and documents the administration to the patient?", "options": {"A": "Prescription order sets", "B": "Electronic health record", "C": "Medication administration record", "D": "Computerized physician order entry"}, "answer": "C"}, {"source": 3840, "stem": "Which of the following is the most common cause of medication errors in a community pharmacy?", "options": {"A": "Lack of timely lab test results", "B": "Lack of qualified technicians .", "C": "Lack of information about the patient", "D": "Lack of time to communicate with the patient"}, "answer": "C"}, {"source": 3841, "stem": "Which of the following is the important process of quickly obtaining out-of-stock medications in an urgent situation?", "options": {"A": "Code cart", "B": "Final filter", "C": "Bulk compounding log", "D": "Emergency drug procurement"}, "answer": "D"}, {"source": 3843, "stem": "A pharmacy department needs to design a system to maximize the value of the drug therapy to the patients. Which of the following systems should the pharmacy department utilize?", "options": {"A": "Patient safety program", "B": "Pharmacy benefit management", "C": "Pharmacy relabeling and bar-coding system", "D": "Communication with the prescriber and the therapist"}, "answer": "B"}, {"source": 3844, "stem": "The pharmacy contains a health education unit, helps people learn about risk factors for common types of cancers, screening methods for early detection of cancer, and lifestyle behaviors that decrease one’s risk of cancer. Which of the following is the best service that will be most important for this unit?", "options": {"A": "Information on the prevalence of common cancers in the region", "B": "Procedure for conducting breast self-exam and testicular self-exam", "C": "Discussions on the latest medical and holistic health treatments for cancer", "D": "Analysis of the influences of genetic and hereditary factors on the development of cancer"}, "answer": "B"}, {"source": 3846, "stem": "Which of the following phases through which post approval of unexpected adverse drug reaction can be assessed?", "options": {"A": "Phase |", "B": "Phase II", "C": "Phase Ill", "D": "Phase IV"}, "answer": "D"}, {"source": 3847, "stem": "Which of the following medications can cause pneumonia as a long-term side effect?", "options": {"A": "Lisinopril", "B": "Metformin", "C": "Simvastatin Mot", "D": "Omeprazole Willy"}, "answer": "D"}, {"source": 3848, "stem": "A 44-year-old man was newly diagnosed with diabetes. His history is positive for developing hives after using Trimethoprim/sulfamethoxazole. One of the following antihyperglycemic medications is contraindicated with this type of allergy? PIS Bical de", "options": {"A": "Insulin ma iy ty Lily \\ ee", "B": "Glipizide | ly a eae i", "C": "Metformin i", "D": "Pioglitazone A ays \\\\"}, "answer": "B"}, {"source": 3849, "stem": "A 36-year-old man is using citalopram 20 mg PO daily for depression, which he has been taking for 1 year. A week ago, he had a severe skin infection and was prescribed linezolid 600 mg PO q12h for a total duration of 14 days. The patient began to get confused and easily agitated. He felt like he was sweating heavily and started to tremor and develop seizures. He was noticeably shivering. Which of the following is the name of this drug-drug interaction that happened to this patient?", "options": {"A": "Hepatotoxicity", "B": "Seizure activity", "C": "Serotonin syndrome", "D": "Stevens-Johnson syndrome"}, "answer": "C"}, {"source": 3850, "stem": "Which of the following best describes the purpose of a pharmacoeconomic analysis?", "options": {"A": "To cut health care costs by limiting expensive drugs", "B": "To determine the most useful treatment, in terms of efficacy and quality of life", "C": "To assess which drugs will prevent the most patient harm and encourage using them", "D": "To determine what medications to add to the pharmacy formulary based on their cost effective profile"}, "answer": "D"}, {"source": 3851, "stem": "Which of the following best represents direct medical cost?", "options": {"A": "Quality of life", "B": "Absence from work", "C": "Cost of medications", "D": "Flight transportation"}, "answer": "C"}, {"source": 3852, "stem": "Which of the following best represents non direct costs?", "options": {"A": "Laboratory tests", "B": "Lost pr  pharmacist: “I have read that this medication can cause malignancy, and | don't want to get this horrible disease.” How would the pharmacist reply to the patient?", "options": {"A": "Confirm that Humira may increase risk of malignancy", "B": "Humira is not Used for treating Crohn's Disease", "C": "Humira does not increase risk of malignancy", "D": "Discuss potential benefits vs. Risks of Humira"}, "answer": "D"}, {"source": 3866, "stem": "What is the first step to be done prior to interviewing an 18-year-old person for a survey/research?", "options": {"A": "Give free gift", "B": "Get informed consent", "C": "Get parent's approval", "D": "Get parent's full information"}, "answer": "B"}, {"source": 3867, "stem": "Which of the following is the reason informed consent is important in clinical trials?", "options": {"A": "It promotes clinical research", "B": "It enables the investigator to recruit participants of his choice", "C": "It provides the participant with the information regarding remote risks", "D": "It provides information to allow making decision about participation in the clinical investigation"}, "answer": "D"}, {"source": 3868, "stem": "Which of the following people is eligible and competent to sign consent for trial participation?", "options": {"A": "Unconscious patient", "B": "Healthy child at the age of 13", "C": "A student at pharmacy school", "D": "Mentally unstable but adult"}, "answer": "C"}, {"source": 3869, "stem": "Which of the following is the action a pharmacist researcher should take if there is a conflict of interest?", "options": {"A": "Avoid such conflicts in the future", "B": "Disclose the information to his manager", "C": "Keep the information to himself so as not to frighten the participants", "D": "Disclose the information to the medical journal to which he will submit the data"}, "answer": "D"}, {"source": 3870, "stem": "A pharmacist dispensed the wrong drug to a patient. His pharmacy manager screamed at him in front of the staff. What D": "Private and third sector participation 1 : . ath ys"}, "answer": "B"}, {"source": 3962, "stem": "The Ministry of Health (MOH) has launched recently a Program for students in schools to early detect potential health disorders or diseases. The program includes the preparation of student’s medical record history (especially for chronic diseases and disabilities), conditions of students (under or overweight, tooth decay, visual acuity, depression, learning disabilities), as well as screening of female students for communicable diseases. Which one of the following programs is describing this initiative?", "options": {"A": "Students Health a", "B": "Primary healthcare", "C": "Childhood Screening ; ee", "D": "School-Based Screening Program ptt"}, "answer": "D"}, {"source": 3963, "stem": "The current MOH statistics indicate that there is a maldistribution of health care services and health professionals across geographical areas. People experience long waiting lists for many health care services and facilities. Additionally, there is a dearth of services for disadvantaged groups such as the elderly, adolescents and people with special needs such as disability, particularly in rural areas. Optimizing the health care services requires equity in the distribution of health care facilities and health professionals throughout the nation. This is from WHO report about Health Care Delivery System in Saudi Arabia. Which of the following issues is describing this statement?", "options": {"A": "Quality of Healthcare Services", "B": "Structure of Healthcare services", "C": "Availability of Healthcare services", "D": "Accessibility of healthcare services"}, "answer": "D"}, {"source": 3965, "stem": "In 200 Beds hospital, TPN service is provided by the automated TPN compounder. The machine is not working and the in-charge pharmacist contacted maintenance and they informed him that the machine might be working after 2 days. During this period critical patients’ needs should be obtained. Which of the following decisions should the pharmacy administration take so that the service won’t be disturbed?", "options": {"A": "Prepare TPNs manually", "B": "Hold the TPN orders for patients", "C": "Supply patients with IV fluids instead", "D": "Outsourcing the TPN preparations will be done by another hospital"}, "answer": "A"}, {"source": 3967, "stem": "In the hospital, there is an expansion to the ICU beds from 5 beds to 25 beds by end of the year. Before expansion, the service for those beds was provided from the main pharmacy central unit dose. As part of the expansion plan you as a pharmacy manager were asked to provide the hospital administration with the proper plan for the service. Which of the following decisions will consider service?", "options": {"A": "Increase staff number", "B": "Open a satellite pharmacy ;", "C": "Improve floor stock items", "D": "Add an automated dispensing unit machine"}, "answer": "B"}];let idx=0,answers=Array(questions.length).fill(null),submitted=false;
function render(){const q=questions[idx];const pct=Math.round((idx/Math.max(1,questions.length-1))*100);document.getElementById('app').innerHTML=`<h1>DHA Set 20 — Live MCQ Exam</h1><div class="sub">Source questions are kept separate for this set. The quiz uses answers visibly marked in the scan.</div><div class="top"><span>Question ${idx+1} of ${questions.length}</span><span>Source Q. ${q.source}</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="q">${esc(q.stem)}</div>${['A','B','C','D'].map(x=>`<button class="${answers[idx]===x?'sel':''}" onclick="choose('${x}')"><b>${x}.</b> ${esc(q.options[x])}</button>`).join('')}<div class="nav"><button onclick="prev()">← Previous</button><button onclick="next()">Next →</button></div><button onclick="submitExam()" style="text-align:center;margin-top:14px">Submit Exam</button>`}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function choose(x){answers[idx]=x;render()}function prev(){if(idx>0){idx--;render()}}function next(){if(idx<questions.length-1){idx++;render()}}function submitExam(){if(!confirm('Submit the exam now?'))return;submitted=true;showResult()}
function showResult(){let scored=0,correct=0,wrong=0,unanswered=0,unscored=0;questions.forEach((q,i)=>{if(!q.answer){unscored++;return};scored++;if(!answers[i])unanswered++;else if(answers[i]===q.answer)correct++;else wrong++});let pct=scored?Math.round(correct/scored*100):0;let rows=questions.map((q,i)=>{let cls=!q.answer?'':answers[i]===q.answer?'correct':'wrong';return `<div class="r ${cls}"><b>Q${i+1} — Source ${q.source}</b><br>${esc(q.stem)}<br><small>Your answer: ${answers[i]||'Unanswered'} · Correct: ${q.answer||'Not reliably marked in scan'}</small></div>`}).join('');document.getElementById('app').innerHTML=`<h1>DHA Set 20 — Live MCQ Exam</h1><div class="result"><b>Score: ${correct} / ${scored} (${pct}%)</b><br>Correct: ${correct} · Wrong: ${wrong} · Unanswered: ${unanswered} · Unscored: ${unscored}</div><div class="review">${rows}</div><div class="restart"><button onclick="location.reload()" style="text-align:center">Restart Exam</button></div>`}
render();</script></body></html>
